<h2>Custom University account</h2>
<p>This setup screen and its fields belong entirely to the example pack.</p>
<label for="realm">Account realm</label><select id="realm"><option value="university">University</option><option value="hospital">Teaching hospital</option></select>
<label for="account">Account name (optional)</label><input id="account" autocomplete="off">
<label for="password">Account password (optional)</label><input id="password" type="password" autocomplete="new-password">
<p>Use fictional values when trying this example. The pack can also leave account entry to the university page.</p>
